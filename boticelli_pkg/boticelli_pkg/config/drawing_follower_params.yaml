global_frame: "map"
robot_frame: "base_footprint"

path_topic: "/drawing_path"
cmd_vel_topic: "/cmd_vel"

# Seguiment general
lookahead_distance: 0.10
min_lookahead_distance: 0.055

# Velocitat de dibuix
linear_speed: 0.028
min_linear_speed: 0.010
max_reverse_speed: 0.012

# Reduccio de velocitat segons forma
curve_speed_factor: 0.70
corner_speed_factor: 0.40

# Gir
max_angular_speed: 0.45
angular_gain: 1.8

# Si el retolador esta al centre de gir del robot, millor false.
# Això evita que en girar quiet el retolador faci arcs estranys.
use_tool_offset_control: false
tool_offset_x: 0.0
tool_offset_y: 0.0
tool_control_gain: 1.4

# Tolerancies
goal_tolerance: 0.065
waypoint_tolerance: 0.050
max_start_distance: 0.40
closed_goal_tolerance: 0.045

angle_tolerance: 0.10
turn_in_place_angle: 0.70

# Deteccio de corbes i cantonades
# Corba: només baixa una mica la velocitat.
# Cantonada: s'apropa al vertex, para i gira quiet.
curve_angle_threshold: 0.35
corner_angle_threshold: 0.75

corner_detection_distance: 0.24
corner_slowdown_distance: 0.16
corner_stop_radius: 0.060
corner_tangent_distance: 0.10

progress_search_window: 45
max_progress_index_step: 5
corner_back_search: 0
corner_min_index_gap: 5

control_rate: 20.0

rotate_closed_path_to_nearest: true
reverse_closed_path_to_match_heading: true
start_heading_weight: 0.08
closing_start_points: 4
require_start_command: true
prealign_enabled: false

# Aquest és el canvi important:
# false = Pure Pursuit arrodoneix
# true  = respecta cantonades fortes
stop_at_corners: true

# Parada temporal si apareix un obstacle mentre el robot dibuixa
pause_on_obstacle: true
obstacle_scan_topic: "/scan"
obstacle_stop_distance: 0.30
obstacle_min_distance: 0.12
obstacle_front_angle_deg: 20.0
